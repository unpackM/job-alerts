name: Job Alerts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "immediate-alert"
        type: choice
        options:
          - immediate-alert
          - list-all
          - collect-only
          - summary-today
          - summary-yesterday
  schedule:
    # 09:00 KST
    - cron: "0 0 * * *"
    # 13:00 KST
    - cron: "0 4 * * *"
    # 18:00 KST
    - cron: "0 9 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore DB
        uses: actions/cache/restore@v4
        with:
          path: data/jobs-db.json
          key: job-alerts-db-${{ github.run_id }}
          restore-keys: |
            job-alerts-db-

      - name: Choose run mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.mode }}" in
              list-all)          mode="--list-all" ;;
              collect-only)      mode="--collect-only" ;;
              summary-yesterday) mode="--summary-yesterday" ;;
              summary-today)     mode="--summary-today" ;;
              *)                 mode="" ;;
            esac
          else
            # Scheduled runs only alert on newly detected postings, never resend
            # the full matching list, so the same job isn't pushed 3x/day.
            mode=""
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run job alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_ALERTS_MIN_SCORE: "60"
          JOB_ALERTS_DAILY_SUMMARY_SCORE: "50"
        run: node src/job-alerts.js ${{ steps.mode.outputs.mode }}

      - name: Save DB
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs-db.json
          key: job-alerts-db-${{ github.run_id }}
